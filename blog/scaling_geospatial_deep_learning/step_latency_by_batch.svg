<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="Grouped bar chart of measured FP32 and AMP FP16 median step latency with p95 markers at batch sizes one, two and four">
  <title>Measured optimisation-step latency (ms); dashes mark p95</title>
  <style>
    .ax    { stroke: #cfcfcf; stroke-width: 1; }
    .grid  { stroke: #e9e9e9; stroke-width: 1; }
    .lbl   { font: 13px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #6b6b6b; }
    .val   { font: 12px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0a0a0a; }
    .ttl   { font: 600 14px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0a0a0a; }
    .s     { fill: none; stroke: #0a0a0a; stroke-width: 2; }
    .mk    { fill: #ffffff; stroke: #0a0a0a; stroke-width: 1.6; }
    .bar   { fill: #0a0a0a; }
    .bar2  { fill: #ffffff; stroke: #0a0a0a; stroke-width: 1.6; }
  </style>
  <rect width="760" height="430" fill="#ffffff"/>
  <text class="ttl" x="20" y="26">Measured optimisation-step latency (ms); dashes mark p95</text>
  <line class="grid" x1="70" y1="374" x2="730" y2="374"/>
  <text class="lbl" x="62" y="378" text-anchor="end">0</text>
  <line class="grid" x1="70" y1="303" x2="730" y2="303"/>
  <text class="lbl" x="62" y="307" text-anchor="end">25</text>
  <line class="grid" x1="70" y1="231" x2="730" y2="231"/>
  <text class="lbl" x="62" y="235" text-anchor="end">50</text>
  <line class="grid" x1="70" y1="160" x2="730" y2="160"/>
  <text class="lbl" x="62" y="164" text-anchor="end">75</text>
  <line class="grid" x1="70" y1="89" x2="730" y2="89"/>
  <text class="lbl" x="62" y="93" text-anchor="end">100</text>
  <line class="ax" x1="70" y1="40" x2="70" y2="374"/>
  <line class="ax" x1="70" y1="374" x2="730" y2="374"/>
  <rect class="bar" x="116" y="289" width="58" height="85"/>
  <rect class="bar2" x="186" y="304" width="58" height="70"/>
  <text class="val" x="145" y="282" text-anchor="middle">29.91</text>
  <text class="val" x="215" y="297" text-anchor="middle">24.52</text>
  <line x1="116" y1="287.2" x2="174" y2="287.2" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="3 3"/>
  <line x1="186" y1="301.3" x2="244" y2="301.3" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text class="lbl" x="180" y="394" text-anchor="middle">1</text>
  <rect class="bar" x="336" y="217" width="58" height="157"/>
  <rect class="bar2" x="406" y="262" width="58" height="112"/>
  <text class="val" x="365" y="210" text-anchor="middle">54.97</text>
  <text class="val" x="435" y="255" text-anchor="middle">39.20</text>
  <line x1="336" y1="216.1" x2="394" y2="216.1" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="3 3"/>
  <line x1="406" y1="260.4" x2="464" y2="260.4" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text class="lbl" x="400" y="394" text-anchor="middle">2</text>
  <rect class="bar" x="556" y="75" width="58" height="299"/>
  <rect class="bar2" x="626" y="164" width="58" height="210"/>
  <text class="val" x="585" y="68" text-anchor="middle">105.00</text>
  <text class="val" x="655" y="157" text-anchor="middle">73.65</text>
  <line x1="556" y1="73.3" x2="614" y2="73.3" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="3 3"/>
  <line x1="626" y1="160.3" x2="684" y2="160.3" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text class="lbl" x="620" y="394" text-anchor="middle">4</text>
  <text class="lbl" x="400" y="418" text-anchor="middle">batch size</text>
  <rect class="bar" x="84" y="48" width="16" height="12"/>
  <text class="lbl" x="106" y="59">FP32 median</text>
  <rect class="bar2" x="188" y="48" width="16" height="12"/>
  <text class="lbl" x="210" y="59">AMP FP16 median</text>
</svg>
