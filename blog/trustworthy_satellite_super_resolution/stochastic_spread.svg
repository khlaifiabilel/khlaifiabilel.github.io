<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 194" role="img" aria-label="Paired bar chart of mean and p95 two-sigma stochastic spread for the rural and urban examples, each row normalised to the urban value with true values labelled">
  <title>Stochastic spread across five 25-step passes - measured</title>
  <style>
    .ax    { stroke: #cfcfcf; stroke-width: 1; }
    .grid  { stroke: #e9e9e9; stroke-width: 1; }
    .lbl   { font: 13px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #6b6b6b; }
    .val   { font: 12px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0a0a0a; }
    .ttl   { font: 600 14px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0a0a0a; }
    .s     { fill: none; stroke: #0a0a0a; stroke-width: 2; }
    .mk    { fill: #ffffff; stroke: #0a0a0a; stroke-width: 1.6; }
    .bar   { fill: #0a0a0a; }
    .bar2  { fill: #ffffff; stroke: #0a0a0a; stroke-width: 1.6; }
  </style>
  <rect width="760" height="194" fill="#ffffff"/>
  <text class="ttl" x="20" y="28">Stochastic spread across five 25-step passes - measured</text>
  <rect class="bar" x="466" y="16" width="16" height="12"/>
  <text class="lbl" x="488" y="27">Rural</text>
  <rect class="bar2" x="566" y="16" width="16" height="12"/>
  <text class="lbl" x="588" y="27">Urban</text>
  <line class="ax" x1="236" y1="48" x2="236" y2="144"/>
  <text class="lbl" x="228" y="74" text-anchor="end">Mean 2&#963; spread</text>
  <rect class="bar" x="236" y="58" width="127.3" height="14"/>
  <text class="val" x="370.3" y="69">0.0057</text>
  <rect class="bar2" x="236" y="75" width="440.0" height="14"/>
  <text class="val" x="683.0" y="86">0.0196</text>
  <text class="lbl" x="228" y="122" text-anchor="end">p95 2&#963; spread</text>
  <rect class="bar" x="236" y="106" width="99.8" height="14"/>
  <text class="val" x="342.8" y="117">0.0106</text>
  <rect class="bar2" x="236" y="123" width="440.0" height="14"/>
  <text class="val" x="683.0" y="134">0.0467</text>
  <text class="lbl" x="20" y="184">Bars normalised per row to the urban value. Spread-residual Pearson r: 0.375 (rural), 0.421 (urban). Not calibrated uncertainty.</text>
</svg>
