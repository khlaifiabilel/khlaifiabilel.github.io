<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Implemented S1/S2 crop segmentation and ×10 model-derived RGB detail architecture</title>
  <desc id="desc">Sentinel-2 and dual-orbit Sentinel-1 time series pass through temporal encoders, validity-aware gated fusion, a spatial feature pyramid, direct 10 metre crop heads, and a constrained ×10 detail decoder. SPOT RGB, semantic labels, and parcel instances provide training-only supervision.</desc>
  <defs>
    <style>
      .title { font: 700 29px Arial, sans-serif; fill: #122033; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #526275; }
      .section { font: 700 12px Arial, sans-serif; fill: #64748b; letter-spacing: 1.7px; }
      .box-title { font: 700 17px Arial, sans-serif; fill: #172033; }
      .box-text { font: 400 13px Arial, sans-serif; fill: #3d4d61; }
      .small { font: 400 11px Arial, sans-serif; fill: #627184; }
      .tensor { font: 600 12px Menlo, Consolas, monospace; fill: #243b53; }
      .badge { font: 700 10px Arial, sans-serif; letter-spacing: .6px; }
      .loss { font: 600 11px Menlo, Consolas, monospace; fill: #8a3025; }
      .arrow { stroke: #334e68; stroke-width: 2.8; fill: none; marker-end: url(#arrow); }
      .line { stroke: #334e68; stroke-width: 2.8; fill: none; }
      .anchor { stroke: #7c3aed; stroke-width: 2.2; fill: none; marker-end: url(#arrow-purple); }
      .train { stroke: #c44536; stroke-width: 2.3; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow-red); }
      .guide { stroke: #d8e0e9; stroke-width: 1.4; stroke-dasharray: 4 6; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334e68"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c44536"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#14213d" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="1800" height="1120" fill="#ffffff"/>

  <text x="48" y="48" class="title">Implemented S1/S2 joint crop intelligence and ×10 model-derived RGB detail</text>
  <text x="48" y="76" class="subtitle">Sentinel-only deployment | SPOT and PASTIS training supervision | directly supervised 10 m and model-derived products on a 1 m grid</text>

  <g transform="translate(1350 28)">
    <line x1="0" y1="13" x2="44" y2="13" class="arrow"/>
    <text x="55" y="18" class="small">deployment path</text>
    <line x1="170" y1="13" x2="214" y2="13" class="train"/>
    <text x="226" y="18" class="small">training only</text>
  </g>

  <text x="48" y="122" class="section">SENTINEL INPUTS</text>
  <text x="374" y="122" class="section">TEMPORAL ENCODERS</text>
  <text x="746" y="122" class="section">FUSION AND BACKBONE</text>
  <text x="1080" y="122" class="section">TASK HEADS</text>
  <text x="1432" y="122" class="section">PRODUCTS</text>

  <!-- Sentinel-2 input -->
  <g filter="url(#shadow)">
    <rect x="46" y="154" width="278" height="184" rx="18" fill="#eaf2ff" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <rect x="66" y="174" width="110" height="23" rx="11" fill="#2563eb"/>
  <text x="121" y="190" text-anchor="middle" class="badge" fill="#ffffff">REQUIRED</text>
  <text x="66" y="228" class="box-title">Sentinel-2 time series</text>
  <text x="66" y="255" class="tensor">[B,T2,10,H,W] at 10 m</text>
  <text x="66" y="281" class="box-text">10 bands | 16 sampled dates</text>
  <text x="66" y="305" class="box-text">day-of-year encoded</text>
  <text x="66" y="327" class="small">YYYYMMDD provenance | validity masks</text>

  <!-- Sentinel-1 inputs -->
  <g filter="url(#shadow)">
    <rect x="46" y="380" width="278" height="124" rx="16" fill="#eaf9fb" stroke="#168aa1" stroke-width="2.2"/>
  </g>
  <text x="66" y="412" class="box-title">Sentinel-1 ascending</text>
  <text x="66" y="439" class="tensor">[B,T1A,2,H,W] VV / VH</text>
  <text x="66" y="465" class="box-text">4 sampled dates + validity</text>
  <text x="66" y="488" class="small">ascending orbit embedding</text>

  <g filter="url(#shadow)">
    <rect x="46" y="538" width="278" height="124" rx="16" fill="#eaf9fb" stroke="#168aa1" stroke-width="2.2"/>
  </g>
  <text x="66" y="570" class="box-title">Sentinel-1 descending</text>
  <text x="66" y="597" class="tensor">[B,T1D,2,H,W] VV / VH</text>
  <text x="66" y="623" class="box-text">4 sampled dates + validity</text>
  <text x="66" y="646" class="small">descending orbit embedding</text>

  <!-- Temporal encoders -->
  <g filter="url(#shadow)">
    <rect x="374" y="154" width="322" height="218" rx="20" fill="#eef2ff" stroke="#5b61c8" stroke-width="2.7"/>
  </g>
  <rect x="396" y="174" width="126" height="23" rx="11" fill="#5b61c8"/>
  <text x="459" y="190" text-anchor="middle" class="badge" fill="#ffffff">OPTICAL</text>
  <text x="396" y="229" class="box-title">S2 temporal encoder</text>
  <text x="396" y="257" class="box-text">convolutional spectral stem</text>
  <text x="396" y="282" class="box-text">annual and semi-annual date encoding</text>
  <text x="396" y="307" class="box-text">per-pixel temporal Transformer</text>
  <text x="396" y="332" class="box-text">validity-masked temporal mean</text>
  <text x="396" y="355" class="tensor">F_s2 [B,C,H,W]</text>

  <g filter="url(#shadow)">
    <rect x="374" y="414" width="322" height="248" rx="20" fill="#edf9fa" stroke="#168aa1" stroke-width="2.7"/>
  </g>
  <rect x="396" y="434" width="142" height="23" rx="11" fill="#168aa1"/>
  <text x="467" y="450" text-anchor="middle" class="badge" fill="#ffffff">SHARED RADAR</text>
  <text x="396" y="489" class="box-title">S1 temporal encoder</text>
  <text x="396" y="517" class="box-text">shared VV/VH convolutional stem</text>
  <text x="396" y="542" class="box-text">orbit-specific learned embeddings</text>
  <text x="396" y="567" class="box-text">per-pixel temporal Transformer</text>
  <text x="396" y="592" class="box-text">validity-masked temporal mean</text>
  <text x="396" y="620" class="tensor">F_asc, F_des [B,C,H,W]</text>
  <text x="396" y="645" class="small">same weights, separate orbit context</text>

  <!-- Input arrows -->
  <path d="M324 246 H374" class="arrow"/>
  <path d="M324 442 H348 V500 H374" class="arrow"/>
  <path d="M324 600 H348 V574 H374" class="arrow"/>
  <path d="M46 320 H24 V696 H1048" class="line"/>
  <path d="M1048 696 V625 H1080" class="arrow"/>
  <path d="M1048 696 V770 H1080" class="arrow"/>
  <text x="608" y="688" class="small">direct S2 RGB composite / per-frame anchor</text>

  <!-- Fusion -->
  <g filter="url(#shadow)">
    <rect x="746" y="212" width="286" height="166" rx="19" fill="#f3efff" stroke="#7c3aed" stroke-width="2.7"/>
  </g>
  <rect x="768" y="232" width="136" height="23" rx="11" fill="#7c3aed"/>
  <text x="836" y="248" text-anchor="middle" class="badge" fill="#ffffff">VALIDITY AWARE</text>
  <text x="768" y="287" class="box-title">Spatial modality gate</text>
  <text x="768" y="315" class="box-text">softmax over S2 / S1A / S1D</text>
  <text x="768" y="340" class="box-text">mask absent modalities before fusion</text>
  <text x="768" y="363" class="small">concat optical + gated representation</text>

  <path d="M696 264 H746" class="arrow"/>
  <path d="M696 538 H722 V326 H746" class="arrow"/>

  <!-- Spatial pyramid -->
  <g filter="url(#shadow)">
    <rect x="746" y="444" width="286" height="194" rx="19" fill="#e9faf4" stroke="#138a72" stroke-width="2.7"/>
  </g>
  <rect x="768" y="464" width="96" height="23" rx="11" fill="#138a72"/>
  <text x="816" y="480" text-anchor="middle" class="badge" fill="#ffffff">SHARED</text>
  <text x="768" y="519" class="box-title">Spatial pyramid + FPN</text>
  <text x="768" y="547" class="box-text">10 m, 20 m and 40 m feature levels</text>
  <text x="768" y="572" class="box-text">lateral fusion to the 10 m grid</text>
  <text x="768" y="597" class="box-text">depthwise residual refinement</text>
  <text x="768" y="622" class="tensor">F_10m [B,Cf,H,W]</text>

  <path d="M889 378 V444" class="arrow"/>

  <!-- Direct heads -->
  <g filter="url(#shadow)">
    <rect x="1080" y="154" width="304" height="236" rx="19" fill="#edf9f2" stroke="#16845b" stroke-width="2.7"/>
  </g>
  <rect x="1102" y="174" width="112" height="23" rx="11" fill="#16845b"/>
  <text x="1158" y="190" text-anchor="middle" class="badge" fill="#ffffff">DIRECT 10 M</text>
  <text x="1102" y="229" class="box-title">Supervised task heads</text>
  <text x="1102" y="260" class="box-text">19-class semantic logits</text>
  <text x="1102" y="286" class="box-text">parcel/crop boundary logits</text>
  <text x="1102" y="312" class="box-text">18-label crop presence</text>
  <text x="1102" y="338" class="box-text">shared FPN features exposed</text>
  <text x="1102" y="369" class="small">parcel pooling needs external parcel IDs</text>

  <!-- ×10 decoder -->
  <g filter="url(#shadow)">
    <rect x="1080" y="444" width="304" height="238" rx="19" fill="#fff3e8" stroke="#e07a1f" stroke-width="2.7"/>
  </g>
  <rect x="1102" y="464" width="148" height="23" rx="11" fill="#e07a1f"/>
  <text x="1176" y="480" text-anchor="middle" class="badge" fill="#ffffff">MODEL-DERIVED</text>
  <text x="1102" y="519" class="box-title">Constrained ×10 decoder</text>
  <text x="1102" y="547" class="box-text">bilinear ×10 upsampling + residual refinement</text>
  <text x="1102" y="572" class="box-text">semantic / boundary / RGB detail</text>
  <text x="1102" y="597" class="box-text">zero mean within every 10 m block</text>
  <text x="1102" y="622" class="box-text">low logits + S2 RGB composite anchors</text>
  <text x="1102" y="650" class="small">optional RGB log-variance head</text>

  <!-- Backbone to heads -->
  <path d="M1032 540 H1054 V272 H1080" class="arrow"/>
  <path d="M1032 540 H1080" class="arrow"/>
  <path d="M1232 390 V420 H1208 V444" class="anchor"/>
  <text x="1245" y="419" class="small">semantic + boundary anchors</text>

  <!-- Direct products -->
  <g filter="url(#shadow)">
    <rect x="1432" y="154" width="320" height="236" rx="19" fill="#f5fbf7" stroke="#16845b" stroke-width="2.5"/>
  </g>
  <text x="1454" y="188" class="box-title">Direct 10 m products</text>
  <text x="1454" y="220" class="tensor">semantic [B,19,H,W]</text>
  <text x="1454" y="247" class="tensor">boundary [B,1,H,W]</text>
  <text x="1454" y="274" class="tensor">crop presence [B,18]</text>
  <text x="1454" y="305" class="box-text">direct PASTIS supervision</text>
  <text x="1454" y="330" class="box-text">standard crop metrics at 10 m</text>
  <rect x="1454" y="349" width="142" height="22" rx="11" fill="#d9f2e5"/>
  <text x="1525" y="364" text-anchor="middle" class="badge" fill="#126b4b">PRIMARY EVIDENCE</text>

  <!-- High-resolution products -->
  <g filter="url(#shadow)">
    <rect x="1432" y="444" width="320" height="238" rx="19" fill="#fff9f2" stroke="#e07a1f" stroke-width="2.5"/>
  </g>
  <text x="1454" y="478" class="box-title">SPOT storage-grid products</text>
  <text x="1454" y="510" class="tensor">RGB [B,3,10H,10W]</text>
  <text x="1454" y="537" class="tensor">semantic [B,19,10H,10W]</text>
  <text x="1454" y="564" class="tensor">boundary [B,1,10H,10W]</text>
  <text x="1454" y="595" class="box-text">1 m grid | approximately 1.5 m SPOT GSD</text>
  <text x="1454" y="620" class="small">no independent 1 m semantic labels</text>
  <rect x="1454" y="640" width="150" height="22" rx="11" fill="#fff0cf"/>
  <text x="1529" y="655" text-anchor="middle" class="badge" fill="#8a5b00">MODEL-DERIVED</text>

  <path d="M1384 272 H1432" class="arrow"/>
  <path d="M1384 563 H1432" class="arrow"/>

  <!-- Per-date streaming -->
  <g filter="url(#shadow)">
    <rect x="1080" y="710" width="672" height="120" rx="17" fill="#f6f3ff" stroke="#7c3aed" stroke-width="2.1"/>
  </g>
  <text x="1102" y="741" class="box-title">Per-S2-acquisition RGB streaming</text>
  <text x="1102" y="769" class="box-text">shared learned detail + each valid S2 RGB frame -&gt; one dated ×10 product</text>
  <text x="1102" y="793" class="small">retrospective: detail uses the complete supplied S1/S2 sequence</text>
  <text x="1102" y="815" class="small">not independently supervised by a SPOT image for each date</text>
  <path d="M1232 682 V710" class="anchor"/>

  <!-- Training-only region -->
  <line x1="34" y1="844" x2="1766" y2="844" class="guide"/>
  <text x="48" y="832" class="small">Above: deployable Sentinel graph | Below: targets and losses available only during training and evaluation</text>
  <rect x="42" y="862" width="1716" height="216" rx="20" fill="#fff8f6" stroke="#d96c5f" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="66" y="891" class="section" fill="#a43b2e">TRAINING-ONLY SUPERVISION</text>

  <rect x="66" y="916" width="248" height="112" rx="14" fill="#ffffff" stroke="#c44536" stroke-width="1.8"/>
  <text x="86" y="947" class="box-title">SPOT RGB</text>
  <text x="86" y="974" class="tensor">[B,3,10H,10W]</text>
  <text x="86" y="999" class="box-text">standardised multiscale reconstruction + gradients</text>
  <text x="86" y="1021" class="small">one undated 2019 reference per patch</text>

  <rect x="342" y="916" width="248" height="112" rx="14" fill="#ffffff" stroke="#c44536" stroke-width="1.8"/>
  <text x="362" y="947" class="box-title">Semantic labels</text>
  <text x="362" y="974" class="tensor">[B,H,W] IDs 0..19</text>
  <text x="362" y="999" class="box-text">cross-entropy + Dice</text>
  <text x="362" y="1021" class="small">10 m labels | void 19 ignored</text>

  <rect x="618" y="916" width="248" height="112" rx="14" fill="#ffffff" stroke="#c44536" stroke-width="1.8"/>
  <text x="638" y="947" class="box-title">Parcel instances</text>
  <text x="638" y="974" class="tensor">[B,H,W] instance IDs</text>
  <text x="638" y="999" class="box-text">boundary BCE + Dice</text>
  <text x="638" y="1021" class="small">SPOT edges only near label boundaries</text>

  <rect x="894" y="906" width="838" height="132" rx="15" fill="#fffdfc" stroke="#e5a096" stroke-width="1.8"/>
  <text x="916" y="937" class="box-title">Weighted multi-task objective</text>
  <text x="916" y="966" class="loss">1.0 CE + 0.5 Dice + 0.25 boundary + 0.5 crop presence</text>
  <text x="916" y="991" class="loss">+ 0.5 S2 degradation + 0.25 SPOT reconstruction + 0.1 SPOT gradients</text>
  <text x="916" y="1016" class="loss">+ 0.1 SPOT boundary + 0.1 semantic-boundary consistency</text>
  <text x="916" y="1037" class="small">SPOT and labels are never consumed by model.forward.</text>

  <!-- Training supervision arrows -->
  <path d="M190 916 V874 H1068 V563 H1080" class="train"/>
  <path d="M466 916 V886 H1038 V260 H1080" class="train"/>
  <path d="M742 916 V898 H1046 V286 H1080" class="train"/>
</svg>
