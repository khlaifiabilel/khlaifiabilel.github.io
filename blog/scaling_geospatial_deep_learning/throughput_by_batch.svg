<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">Single-GPU training-step throughput</title>
<desc id="desc">Measured RTX 4080 synthetic compute benchmark; higher is better; data loading excluded</desc>
<style>text{font-family:Arial,sans-serif;fill:#101010}.title{font-size:20px;font-weight:700}.sub{font-size:11px;fill:#666}.tick{font-size:10px;fill:#666}.label{font-size:11px;font-weight:600}.value{font-size:10px;font-weight:700}.grid{stroke:#d8d8d8;stroke-width:1}.axis{stroke:#101010;stroke-width:1.3}.line{fill:none;stroke-width:2.5}.dash{stroke-dasharray:6 5}</style>
<rect width="760" height="430" fill="#ffffff"/>
<text x="42" y="35" class="title">Single-GPU training-step throughput</text>
<text x="42" y="55" class="sub">Measured RTX 4080 synthetic compute benchmark; higher is better; data loading excluded</text>
