<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 386" role="img" aria-label="Paired bar chart of six measured observation-consistency diagnostics for the rural and urban examples, each row normalised to its own maximum with true values labelled">
  <title>Observation-consistency diagnostics - measured, two examples</title>
  <style>
    .ax    { stroke: #cfcfcf; stroke-width: 1; }
    .grid  { stroke: #e9e9e9; stroke-width: 1; }
    .lbl   { font: 13px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #6b6b6b; }
    .val   { font: 12px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0a0a0a; }
    .ttl   { font: 600 14px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0a0a0a; }
    .s     { fill: none; stroke: #0a0a0a; stroke-width: 2; }
    .mk    { fill: #ffffff; stroke: #0a0a0a; stroke-width: 1.6; }
    .bar   { fill: #0a0a0a; }
    .bar2  { fill: #ffffff; stroke: #0a0a0a; stroke-width: 1.6; }
  </style>
  <rect width="760" height="386" fill="#ffffff"/>
  <text class="ttl" x="20" y="28">Observation-consistency diagnostics - measured, two examples</text>
  <rect class="bar" x="466" y="16" width="16" height="12"/>
  <text class="lbl" x="488" y="27">Rural</text>
  <rect class="bar2" x="566" y="16" width="16" height="12"/>
  <text class="lbl" x="588" y="27">Urban</text>
  <line class="ax" x1="236" y1="48" x2="236" y2="336"/>
  <text class="lbl" x="228" y="74" text-anchor="end">Mean spectral angle</text>
  <rect class="bar" x="236" y="58" width="179.1" height="14"/>
  <text class="val" x="422.1" y="69">0.827&#176;</text>
  <rect class="bar2" x="236" y="75" width="440.0" height="14"/>
  <text class="val" x="683.0" y="86">2.031&#176;</text>
  <text class="lbl" x="228" y="122" text-anchor="end">p95 spectral angle</text>
  <rect class="bar" x="236" y="106" width="133.3" height="14"/>
  <text class="val" x="376.3" y="117">1.641&#176;</text>
  <rect class="bar2" x="236" y="123" width="440.0" height="14"/>
  <text class="val" x="683.0" y="134">5.416&#176;</text>
  <text class="lbl" x="228" y="170" text-anchor="end">NDVI MAE (box-averaged)</text>
  <rect class="bar" x="236" y="154" width="192.8" height="14"/>
  <text class="val" x="435.8" y="165">0.0123</text>
  <rect class="bar2" x="236" y="171" width="440.0" height="14"/>
  <text class="val" x="683.0" y="182">0.0280</text>
  <text class="lbl" x="228" y="218" text-anchor="end">p95 absolute NDVI error</text>
  <rect class="bar" x="236" y="202" width="163.3" height="14"/>
  <text class="val" x="406.3" y="213">0.0315</text>
  <rect class="bar2" x="236" y="219" width="440.0" height="14"/>
  <text class="val" x="683.0" y="230">0.0848</text>
  <text class="lbl" x="228" y="266" text-anchor="end">Largest band MAE (B08)</text>
  <rect class="bar" x="236" y="250" width="103.8" height="14"/>
  <text class="val" x="346.8" y="261">0.00307</text>
  <rect class="bar2" x="236" y="267" width="440.0" height="14"/>
  <text class="val" x="683.0" y="278">0.01300</text>
  <text class="lbl" x="228" y="314" text-anchor="end">Learned/bilinear gradient energy</text>
  <rect class="bar" x="236" y="298" width="201.6" height="14"/>
  <text class="val" x="444.6" y="309">3.23&#215;</text>
  <rect class="bar2" x="236" y="315" width="440.0" height="14"/>
  <text class="val" x="683.0" y="326">7.05&#215;</text>
  <text class="lbl" x="20" y="376">Bars are normalised per row to the row maximum; read values from the labels. Units differ per row.</text>
</svg>
