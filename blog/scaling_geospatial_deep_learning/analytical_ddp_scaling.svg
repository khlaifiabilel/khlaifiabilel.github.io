<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="Line chart of analytical Amdahl speedup curves for serial fractions of ten, twenty and thirty-five percent">
  <title>Amdahl speedup bound by serial fraction - analytical, not measured</title>
  <style>
    .ax    { stroke: #cfcfcf; stroke-width: 1; }
    .grid  { stroke: #e9e9e9; stroke-width: 1; }
    .lbl   { font: 13px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #6b6b6b; }
    .val   { font: 12px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0a0a0a; }
    .ttl   { font: 600 14px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0a0a0a; }
    .s     { fill: none; stroke: #0a0a0a; stroke-width: 2; }
    .mk    { fill: #ffffff; stroke: #0a0a0a; stroke-width: 1.6; }
    .bar   { fill: #0a0a0a; }
    .bar2  { fill: #ffffff; stroke: #0a0a0a; stroke-width: 1.6; }
  </style>
  <rect width="760" height="430" fill="#ffffff"/>
  <text class="ttl" x="20" y="26">Amdahl speedup bound by serial fraction - analytical, not measured</text>
  <line class="grid" x1="70" y1="345" x2="730" y2="345"/>
  <text class="lbl" x="62" y="349" text-anchor="end">1</text>
  <line class="grid" x1="70" y1="274" x2="730" y2="274"/>
  <text class="lbl" x="62" y="278" text-anchor="end">2</text>
  <line class="grid" x1="70" y1="203" x2="730" y2="203"/>
  <text class="lbl" x="62" y="207" text-anchor="end">3</text>
  <line class="grid" x1="70" y1="132" x2="730" y2="132"/>
  <text class="lbl" x="62" y="136" text-anchor="end">4</text>
  <line class="grid" x1="70" y1="60" x2="730" y2="60"/>
  <text class="lbl" x="62" y="64" text-anchor="end">5</text>
  <line class="ax" x1="70" y1="40" x2="70" y2="374"/>
  <line class="ax" x1="70" y1="374" x2="730" y2="374"/>
  <text class="lbl" x="70" y="394" text-anchor="middle">1</text>
  <text class="lbl" x="164" y="394" text-anchor="middle">2</text>
  <text class="lbl" x="259" y="394" text-anchor="middle">3</text>
  <text class="lbl" x="353" y="394" text-anchor="middle">4</text>
  <text class="lbl" x="447" y="394" text-anchor="middle">5</text>
  <text class="lbl" x="541" y="394" text-anchor="middle">6</text>
  <text class="lbl" x="636" y="394" text-anchor="middle">7</text>
  <text class="lbl" x="730" y="394" text-anchor="middle">8</text>
  <text class="lbl" x="400" y="418" text-anchor="middle">GPUs (N)</text>
  <polyline class="s" points="70.0,345.5 164.3,287.1 258.6,238.5 352.9,197.4 447.1,162.1 541.4,131.6 635.7,104.8 730.0,81.2"/>
  <circle class="mk" cx="164.3" cy="287.1" r="3.2"/>
  <circle class="mk" cx="352.9" cy="197.4" r="3.2"/>
  <circle class="mk" cx="730.0" cy="81.2" r="3.2"/>
  <line class="s" x1="510" y1="58" x2="546" y2="58"/>
  <text class="lbl" x="554" y="62">10% serial</text>
  <polyline class="s" stroke-dasharray="9 5" points="70.0,345.5 164.3,297.9 258.6,264.0 352.9,238.5 447.1,218.7 541.4,202.9 635.7,189.9 730.0,179.1"/>
  <circle class="mk" cx="164.3" cy="297.9" r="3.2"/>
  <circle class="mk" cx="352.9" cy="238.5" r="3.2"/>
  <circle class="mk" cx="730.0" cy="179.1" r="3.2"/>
  <line class="s" stroke-dasharray="9 5" x1="510" y1="80" x2="546" y2="80"/>
  <text class="lbl" x="554" y="84">20% serial</text>
  <polyline class="s" stroke-dasharray="2.5 4.5" points="70.0,345.5 164.3,311.1 258.6,291.0 352.9,277.7 447.1,268.2 541.4,261.2 635.7,255.8 730.0,251.4"/>
  <circle class="mk" cx="164.3" cy="311.1" r="3.2"/>
  <circle class="mk" cx="352.9" cy="277.7" r="3.2"/>
  <circle class="mk" cx="730.0" cy="251.4" r="3.2"/>
  <line class="s" stroke-dasharray="2.5 4.5" x1="510" y1="102" x2="546" y2="102"/>
  <text class="lbl" x="554" y="106">35% serial</text>
</svg>
