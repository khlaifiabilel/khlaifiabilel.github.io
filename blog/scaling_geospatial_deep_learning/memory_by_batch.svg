<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="Grouped bar chart of measured FP32 and AMP FP16 peak allocated memory at batch sizes one, two and four">
  <title>Measured peak allocated GPU memory (GiB)</title>
  <style>
    .ax    { stroke: #cfcfcf; stroke-width: 1; }
    .grid  { stroke: #e9e9e9; stroke-width: 1; }
    .lbl   { font: 13px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #6b6b6b; }
    .val   { font: 12px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0a0a0a; }
    .ttl   { font: 600 14px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0a0a0a; }
    .s     { fill: none; stroke: #0a0a0a; stroke-width: 2; }
    .mk    { fill: #ffffff; stroke: #0a0a0a; stroke-width: 1.6; }
    .bar   { fill: #0a0a0a; }
    .bar2  { fill: #ffffff; stroke: #0a0a0a; stroke-width: 1.6; }
  </style>
  <rect width="760" height="430" fill="#ffffff"/>
  <text class="ttl" x="20" y="26">Measured peak allocated GPU memory (GiB)</text>
  <line class="grid" x1="70" y1="374" x2="730" y2="374"/>
  <text class="lbl" x="62" y="378" text-anchor="end">0</text>
  <line class="grid" x1="70" y1="283" x2="730" y2="283"/>
  <text class="lbl" x="62" y="287" text-anchor="end">1</text>
  <line class="grid" x1="70" y1="192" x2="730" y2="192"/>
  <text class="lbl" x="62" y="196" text-anchor="end">2</text>
  <line class="grid" x1="70" y1="101" x2="730" y2="101"/>
  <text class="lbl" x="62" y="105" text-anchor="end">3</text>
  <line class="ax" x1="70" y1="40" x2="70" y2="374"/>
  <line class="ax" x1="70" y1="374" x2="730" y2="374"/>
  <rect class="bar" x="116" y="295" width="58" height="79"/>
  <rect class="bar2" x="186" y="313" width="58" height="61"/>
  <text class="val" x="145" y="288" text-anchor="middle">0.87</text>
  <text class="val" x="215" y="306" text-anchor="middle">0.67</text>
  <text class="lbl" x="180" y="394" text-anchor="middle">1</text>
  <rect class="bar" x="336" y="221" width="58" height="153"/>
  <rect class="bar2" x="406" y="257" width="58" height="117"/>
  <text class="val" x="365" y="214" text-anchor="middle">1.68</text>
  <text class="val" x="435" y="250" text-anchor="middle">1.28</text>
  <text class="lbl" x="400" y="394" text-anchor="middle">2</text>
  <rect class="bar" x="556" y="74" width="58" height="300"/>
  <rect class="bar2" x="626" y="146" width="58" height="228"/>
  <text class="val" x="585" y="67" text-anchor="middle">3.29</text>
  <text class="val" x="655" y="139" text-anchor="middle">2.50</text>
  <text class="lbl" x="620" y="394" text-anchor="middle">4</text>
  <text class="lbl" x="400" y="418" text-anchor="middle">batch size</text>
  <rect class="bar" x="84" y="48" width="16" height="12"/>
  <text class="lbl" x="106" y="59">FP32</text>
  <rect class="bar2" x="188" y="48" width="16" height="12"/>
  <text class="lbl" x="210" y="59">AMP FP16</text>
</svg>
