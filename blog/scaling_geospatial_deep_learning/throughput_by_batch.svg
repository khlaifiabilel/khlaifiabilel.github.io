<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="Grouped bar chart of measured FP32 and AMP FP16 throughput at batch sizes one, two and four">
  <title>Measured compute-only throughput, RTX 4080 (samples/s)</title>
  <style>
    .ax    { stroke: #cfcfcf; stroke-width: 1; }
    .grid  { stroke: #e9e9e9; stroke-width: 1; }
    .lbl   { font: 13px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #6b6b6b; }
    .val   { font: 12px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0a0a0a; }
    .ttl   { font: 600 14px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0a0a0a; }
    .s     { fill: none; stroke: #0a0a0a; stroke-width: 2; }
    .mk    { fill: #ffffff; stroke: #0a0a0a; stroke-width: 1.6; }
    .bar   { fill: #0a0a0a; }
    .bar2  { fill: #ffffff; stroke: #0a0a0a; stroke-width: 1.6; }
  </style>
  <rect width="760" height="430" fill="#ffffff"/>
  <text class="ttl" x="20" y="26">Measured compute-only throughput, RTX 4080 (samples/s)</text>
  <line class="grid" x1="70" y1="374" x2="730" y2="374"/>
  <text class="lbl" x="62" y="378" text-anchor="end">0</text>
  <line class="grid" x1="70" y1="319" x2="730" y2="319"/>
  <text class="lbl" x="62" y="323" text-anchor="end">10</text>
  <line class="grid" x1="70" y1="265" x2="730" y2="265"/>
  <text class="lbl" x="62" y="269" text-anchor="end">20</text>
  <line class="grid" x1="70" y1="210" x2="730" y2="210"/>
  <text class="lbl" x="62" y="214" text-anchor="end">30</text>
  <line class="grid" x1="70" y1="155" x2="730" y2="155"/>
  <text class="lbl" x="62" y="159" text-anchor="end">40</text>
  <line class="grid" x1="70" y1="101" x2="730" y2="101"/>
  <text class="lbl" x="62" y="105" text-anchor="end">50</text>
  <line class="grid" x1="70" y1="46" x2="730" y2="46"/>
  <text class="lbl" x="62" y="50" text-anchor="end">60</text>
  <line class="ax" x1="70" y1="40" x2="70" y2="374"/>
  <line class="ax" x1="70" y1="374" x2="730" y2="374"/>
  <rect class="bar" x="116" y="191" width="58" height="183"/>
  <rect class="bar2" x="186" y="151" width="58" height="223"/>
  <text class="val" x="145" y="184" text-anchor="middle">33.4</text>
  <text class="val" x="215" y="144" text-anchor="middle">40.8</text>
  <text class="lbl" x="180" y="394" text-anchor="middle">1</text>
  <rect class="bar" x="336" y="175" width="58" height="199"/>
  <rect class="bar2" x="406" y="95" width="58" height="279"/>
  <text class="val" x="365" y="168" text-anchor="middle">36.4</text>
  <text class="val" x="435" y="88" text-anchor="middle">51.0</text>
  <text class="lbl" x="400" y="394" text-anchor="middle">2</text>
  <rect class="bar" x="556" y="166" width="58" height="208"/>
  <rect class="bar2" x="626" y="77" width="58" height="297"/>
  <text class="val" x="585" y="159" text-anchor="middle">38.1</text>
  <text class="val" x="655" y="70" text-anchor="middle">54.3</text>
  <text class="lbl" x="620" y="394" text-anchor="middle">4</text>
  <text class="lbl" x="400" y="418" text-anchor="middle">batch size</text>
  <rect class="bar" x="84" y="48" width="16" height="12"/>
  <text class="lbl" x="106" y="59">FP32</text>
  <rect class="bar2" x="188" y="48" width="16" height="12"/>
  <text class="lbl" x="210" y="59">AMP FP16</text>
</svg>
